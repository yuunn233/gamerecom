<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>个人信息</title>
    <link href="css/swiper-5.4.5/swiper.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/my.css" rel="stylesheet">
    <link href="css/font-awesome.css" rel="stylesheet">
    <style>
        .nx-nav-container ul {
            width: 100%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }

        .nx-nav-container ul li {
            display: inline-block;
            width: 120px;
            text-align: center;
            line-height: 45px;
        }

        .nx-nav-container a {
            color: #FFFFFF;
        }

        .nx-nav-container a:hover {
            color: aquamarine;
            text-decoration: none;
        }

        td{
            vertical-align: middle !important;
        }

        .table th, .table td {
            text-align: center;
            padding: 12px 15px;
        }
        .table-striped tbody tr:nth-child(odd) {
            background-color: #f9fafb;
        }
        .pagination .page-link {
            background-color: #a8d8d8;
            border: 1px solid #d1e7e3;
            color: #333;
        }
        .pagination .page-item.disabled .page-link {
            background-color: #f1f1f1;
            color: #999;
        }
        .pagination .page-link:hover {
            background-color: #77c7c4;
            color: white;
        }
    </style>
</head>
<body>
<div id="wrapper">
    <div style="text-align: center;">
        <iframe width="700" scrolling="no" height="60" frameborder="0" src="https://i.tianqi.com/index.php?c=code&amp;id=12&amp;num=5"></iframe>
    </div>
    <div class="nx-header">
        <div style="display: flex;width: 100%;height: 30px;line-height: 30px;background-color: #f1f8ff;">
            <div style="flex: 5;padding: 0 10px;color: #1b6d85;">
                欢迎访问游戏推荐系统
            </div>
            <div v-if="user.name" style="flex: 1">
                欢迎您：{{user.name}}
                <a style="margin-left: 30px;color: blue;" href="javascript:void(0);" @click="logout">退出</a>
            </div>
        </div>
    </div>

    <div style="height: 80px;line-height: 80px;">
        <div style="margin-left: 20px;position: relative;">
            <img src="img/mylogo.jpg" style="width: 60px;position: absolute;top: 10px;">
            <b style="margin-left: 60px;font-size: 25px;text-shadow: 5px 5px 3px #d9ecff;color: #1b6d85">游戏推荐系统</b>
        </div>
    </div>

    <div class="nx-nav-container" style="height: 45px;background-color: #9acfea;">
        <ul>
            <li ><a href="index.html">首页</a> </li>
            <!--            <li ><a href="advertiserInfo.html">公告信息</a> </li>-->
            <!--            <li ><a href="messageInfo.html">在线交流</a> </li>-->
            <!--            <li ><a href="linkInfo.html">友情链接</a> </li>-->
            <li ><a href="cartInfo.html">收藏栏信息</a> </li>
            <li ><a href="commentInfo.html">评价信息</a> </li>
            <li class="active"><a href="javascript:void(0)" @click="personalPage">个人信息</a> </li>
            <li v-if="isShow"><a href="/end/page/index.html" target="_blank">进入后台系统</a> </li>
            <li v-if="!isLogin"><a href="/end/page/login.html" target="_blank">登录</a> </li>
            <li v-if="!isLogin"><a href="/end/page/register.html" target="_blank">注册</a> </li>
        </ul>
    </div>

    <div class="container" style="margin-top: 20px; background-color: #f0f8f7; padding: 20px; border-radius: 8px;">

        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default" style="background-color: #ffffff">
                    <div class="panel-heading" style="margin-bottom: 20px;background-color: #85c3b7;color: #ffffff;font-size: 20px;">
                        个人信息
                    </div>
                    <input type="hidden" v-model="entity.id">
                    <div class="panel-body">
                        <form class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">姓名</label>
                                <div class="col-sm-7">
                                    <input type="text" class="form-control" v-model="entity.name" placeholder="请输入姓名" id="name">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label">昵称</label>
                                <div class="col-sm-7">
                                    <input type="text" class="form-control" v-model="entity.nickName" placeholder="请输入昵称" id="nickName">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label">性别</label>
                                <div class="col-sm-7">
                                    <label class="radio-inline">
                                        <input type="radio" value="男" v-model="entity.sex" id="sex1">男
                                    </label>
                                    <label class="radio-inline">
                                        <input type="radio" value="女" v-model="entity.sex" id="sex2">女
                                    </label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label">年龄</label>
                                <div class="col-sm-7">
                                    <input type="text" class="form-control" v-model="entity.age" placeholder="请输入年龄" id="age">
                                </div>
                            </div>
<!--                            <div class="form-group">-->
<!--                                <label class="col-md-3 control-label">生日</label>-->
<!--                                <div class="col-sm-7">-->
<!--                                    <el-date-picker v-model="entity.birthday" id="birthday" tyoe="datetime" clearable value-format="yyyy-MM-dd" placeholder="请选择日期"></el-date-picker>-->
<!--                                </div>-->
<!--                            </div>-->
                            <div class="form-group">
                                <label class="col-md-3 control-label">手机号</label>
                                <div class="col-sm-7">
                                    <input type="text" class="form-control" v-model="entity.phone" placeholder="请输入手机号" id="phone">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-3 control-label">地址</label>
                                <div class="col-sm-7">
                                    <input type="text" class="form-control" v-model="entity.address" placeholder="请输入地址" id="address">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-3 control-label">邮编</label>
                                <div class="col-sm-7">
                                    <input type="text" class="form-control" v-model="entity.code" placeholder="请输入邮编" id="code">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-3 control-label">电子邮箱</label>
                                <div class="col-sm-7">
                                    <input type="text" class="form-control" v-model="entity.email" placeholder="请输入邮箱" id="email">
                                </div>
                            </div>
                        </form>
                        <div style="text-align: center;">
                            <button type="button" class="btn btn-primary" v-on:click="update()">保存</button>
                        </div>


                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/jquery-1.10.2.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/swiper-5.4.5/swiper.min.js"></script>
<script src="js/vue2.6.11/vue.min.js"></script>
<script src="js/vue2.6.11/axios.js"></script>
<script src="js/my.js"></script>
<script>
    new Vue({
        el: "#wrapper",
        data: {
            user: {},   //当前登录用户
            isShow: false,      //是否显示进入后台
            isLogin: false,     //是否已登录
            cartData: [],      //游戏收藏列表
            pageInfo: {},       //翻页信息
            preActive: true,    //是否有上一页,true表示没有，false表示有
            nextActive: true,   //是否有下一页,true表示没有，false表示有
            entity:{
                sex:'女'
            }

        },
        created: function () {
            this.loadData();
        },
        methods: {

            loadData(){
                //查询权限
                axios.get('/auth').then(res => {
                    if (res.data.code === '0') {
                        this.user = res.data.data;
                        if (this.user.level === 1) {
                            this.isShow = true;
                        }
                        this.isLogin = true;
                        axios.get("/getAccountInfo").then(res => {
                            if (res.data.code === '0'){
                                this.entity = res.data.data;
                                //console.log(res.data.data);
                            }else {
                                alert('error',res.data.msg);
                            }
                        });
                    }else {
                        alert("请先登录");
                        location.href = '/end/page/login.html';
                    }
                });
            },
            //保存信息
            update(){
                axios.put("/userInfo",this.entity).then(res => {
                    if (res.data.code === '0'){
                        alert("success","更新成功");
                        this.loadData();
                        //console.log(res.data.data);
                    }else {
                        alert('error',res.data.msg);
                    }
                });
            },


            logout() {
                axios.get('/logout').then(res => {
                    if (res.data.code === '0') {
                        location.href = '/front/index.html';
                    } else {
                        alert(res.data.msg);
                    }
                });
            },
        }
    });
</script>
</body>
</html>
