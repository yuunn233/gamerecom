<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap.css" rel="stylesheet">
    <link href="../css/font-awesome.css" rel="stylesheet"/>
</head>

<style>
    [v-cloak] {
        display: none;
    }

    /* 设置背景图片 */
    body {
        background-image: url('../img/signin.jpg'); /* 替换为你的图片路径 */
        background-size: cover; /* 使图片覆盖整个页面 */
        background-position: center; /* 将图片居中 */
        background-repeat: no-repeat; /* 防止图片重复 */
        height: 100vh; /* 确保背景覆盖整个视口高度 */
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center; /* 垂直居中 */
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        background: rgba(255, 255, 255, 0.8); /* 添加半透明背景，使内容更清晰 */
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 500px; /* 限制容器的最大宽度 */
        box-sizing: border-box;
    }

    .panel-body {
        padding: 0;
    }
</style>

<body>
<div id="app" class="container" v-cloak>
    <div class="row text-center">
        <div class="col-md-12">
            <h2 style="color:#0eb4cf;"><b>管理员注册</b></h2>
        </div>
    </div>
    <hr style="border-color: #1CC09F"/>
    <div class="row">
        <div class="col-lg-10 col-lg-offset-1">
            <div class="panel-body" style="width: 100%; padding-right: 20px; text-align: center; margin: 0 auto; max-width: 400px;">
                <form class="form-horizontal" id="mod">
                    <br/>
                    <input type="hidden" id="id" name="id" v-model="entity.id">

                    <!-- 用户名输入框 -->
                    <div class="form-group input-group">
                        <span class="input-group-addon">姓名：</span>
                        <input type="text" class="form-control" v-model="entity.name" placeholder="用户名" style="width: 100%;"id="name">
                    </div>



                    <div class="form-group input-group">
                        <span class="input-group-addon">昵称：</span>
                        <input type="text" class="form-control" v-model="entity.nickName" placeholder="昵称" style="width: 100%;" id="nickName">
                    </div>

                    <div class="form-group input-group">
                        <span class="input-group-addon">年龄：</span>
                        <input type="text" class="form-control" v-model="entity.age" placeholder="年龄" style="width: 100%;">
                    </div>

<!--                    <div class="form-group input-group">-->
<!--                        <span class="input-group-addon"><i class="fa fa-tag"></i></span>-->
<!--                        <div class="col-sm-7">-->
<!--                            <el-date-picker v-model="entity.birthday" id="birthday" type="datetime" clearable value-format="yyyy-MM-dd" placeholder="请选择日期"></el-date-picker>-->
<!--                        </div>-->
<!--                    </div>-->

                    <div class="form-group input-group">
                        <span class="input-group-addon">手机号：</span>
                        <input type="text" class="form-control" v-model="entity.phone" placeholder="手机号" style="width: 100%;">
                    </div>

                    <div class="form-group input-group">
                        <span class="input-group-addon">地址：</span>
                        <input type="text" class="form-control" v-model="entity.address" placeholder="地址" style="width: 100%;">
                    </div>

                    <div class="form-group input-group">
                        <span class="input-group-addon">邮编：</span>
                        <input type="text" class="form-control" v-model="entity.code" placeholder="邮编" style="width: 100%;">
                    </div>

                    <div class="form-group input-group">
                        <span class="input-group-addon">邮箱：</span>
                        <input type="text" class="form-control" v-model="entity.email" placeholder="邮箱" style="width: 100%;">
                    </div>

                    <div class="form-group input-group" style="background-color: #e4fbfb">
                        <span class="input-group-addon">性别：</span>

                        <label class="radio-inline">
                            <input type="radio" value="男" v-model="entity.sex" id="sex1">男
                        </label>
                        <label class="radio-inline">
                            <input type="radio" value="女" v-model="entity.sex" id="sex2">女
                        </label>
                    </div>

                    <!-- 密码输入框 -->
                    <div class="form-group input-group">
                        <span class="input-group-addon">密码：</span>
                        <input type="password" class="form-control" v-model="entity.password" placeholder="密码" style="width: 100%;">
                    </div>

                    <!-- 确认密码输入框 -->
                    <div class="form-group input-group">
                        <span class="input-group-addon">确认密码：</span>
                        <input type="password" class="form-control" v-model="entity.confirmPassword" placeholder="确认密码" style="width: 100%;">
                    </div>


                    <div class="form-group">
                        <label class="checkbox-inline"></label>
                        <span class="pull-right">
                            <a href="javascript:void(0)" @click="login" style="color: #488a70"><i>已有账号，去登录</i></a>
                        </span>
                        <span class="pull-left">
                            <a href="javascript:void(0)" v-on:click="register2()" style="color: #86a633"><b>用户注册</b></a>
                        </span>
                        <label class="checkbox-inline"></label>
                    </div>


                    <!-- 注册按钮 -->
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="javascript:void(0)" v-on:click="register()" class="btn btn-primary">管理员注册</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="../js/jquery-1.10.2.js"></script>
<script src="../js/bootstrap.min.js"></script>
<script src="../js/jquery.metisMenu.js"></script>
<script src="../js/custom-scripts.js"></script>
<script src="../js/my.js"></script>
<script src="../js/vue2.6.11/vue.min.js"></script>
<script src="../js/vue2.6.11/axios.js"></script>
<script src="../js/echarts.min.js"></script>
<script src="../js/element/index.js"></script>
<script>
    new Vue({
        el: "#app",
        data: {
            user: {
                // name: "",
                // password: "",
                // confirmPassword: "",
                // level: null
            },
            entity:{
                sex:'女'
            },
            authority: [],
            permission: [],
            name: '',//根据账号查询
        },
        created: function () {
            axios.get("/getAuthority").then(res => {
                if (res.data.code === '0'){
                    this.authorities = res.data.data;
                } else {
                    alert(res.data.msg);
                }
            });
        },
        methods: {
            //注册
            register() {
                if (!this.entity.name) {
                    alert("请输入用户名");
                    return;
                }
                if (!this.entity.password) {
                    alert("请输入密码");
                    return;
                }
                if (this.entity.password !== this.entity.confirmPassword) {
                    alert("两次输入的密码不一致");
                    return;
                }
                if (checkValid(this.entity)){
                    if (!this.entity.id){
                        axios.post('/adminInfo', this.entity).then(res => {
                            if (res.data.code === '0') {
                                alert("注册成功");
                                window.location = '/end/page/login.html';
                            } else {
                                alert(res.data.msg);
                            }
                        });
                    }
                }

            },

            register2(){
                window.location = '/end/page/register.html'
            },
            //跳转到登录页面
            login() {
                window.location = '/end/page/login.html';
            }
        }
    });
</script>
</body>
</html>
