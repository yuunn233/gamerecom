    <style>
        [v-cloak] {
            display: none;

        body {
            background-image: url('../img/back4.jpg'); /* 替换为你的背景图片路径 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: #8ac5db;
            margin: 0;
            padding: 0;
        }

        .modern-dashboard {
            background-color: #fff;
            padding: 20px;
        }

        #page-wrapper {
            background-color: #fff;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        .dashboard-box {
            background: linear-gradient(135deg, #85c3b7, #6bb9a6);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            flex: 1 1 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
        }

        .dashboard-box .icon {
            font-size: 28px;
            margin-right: 10px;
        }

        .dashboard-box .text {
            font-size: 20px;
            font-weight: 500;
        }

        .dashboard-image {
            width: 100%;
            text-align: center;
            margin-top: 30px;
        }

        .dashboard-image img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .dashboard-box {
                flex: 1 1 100%;
            }
        }

    </style>
</head>

<script src="../js/vue2.6.11/axios.js"></script>
<script src="../js/echarts.min.js"></script>
<script src="../js/element/index.js"></script>
<script>
    new Vue({
        el: "#wrapper",
        data: {
            user: {},
            authority: [],
            totalUser:0,
            totalGames:0,
            totalType:0,

        },
        created: function () {
            this.user = JSON.parse(localStorage.getItem('user'));
            axios.get("/authority").then(res => {
                if (res.data.code === '0'){
                    this.authority = res.data.data;
                    //console.log(res.data.data);
                }else {
                    msg('error',res.data.msg);
                }
            });

            this.getTotal();
        },
        methods: {

            //用户总数
            getTotal(){
                axios.get("/echarts/getTotal").then(res => {
                   let map = res.data.data;
                   this.totalUser = map['totalUser'];
                   this.totalGames = map['totalGames'];
                   this.totalType = map['totalType'];
                });
            }
        }
    });
</script>
